<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger Multi-tools (fork non officiel) — firmware multi-outils pour balance TigerScale V3</title>
<meta name="description" content="Un firmware personnel et non officiel, ni publié ni supporté par l'équipe TigerTag pour la balance TigerScale V3 : la pesée des bobines plus des outils au choix (TigerPOD, pèse-colis, calibration, mémo presse), installé depuis le navigateur.">
<meta name="theme-color" content="#0d0f14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<script src="tools.js"></script>
<script>
  // The product's name in one place: the header and the texts all read it, so
  // renaming the fork is this line (and the <title> above).
  window.PRODUCT = 'Tiger Multi-tools';
  (function () {
    try {
      var t = localStorage.getItem('mt-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --accent:#ff7a18; --accent-strong:#e96900; --ok:#1aaf6c; --bad:#e6352b;
    --bg:#0d0f14; --bg-alt:#13161d; --panel:#161a22; --panel-hi:#1d222c;
    --line:#2a303c; --fg:#f2f4f8; --muted:#a0a7b5; --faint:#7f8796;
    --link:#ff9a4d; --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#ffffff; --bg-alt:#f3f5fa; --panel:#ffffff; --panel-hi:#f6f7fb;
      --line:#e2e5ee; --fg:#1b1f2c; --muted:#5f6679; --faint:#7d8497;
      --link:#b84f00; --shadow:0 1px 2px rgba(27,31,44,.06), 0 10px 30px rgba(27,31,44,.08);
      color-scheme:light;
    }
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --bg-alt:#f3f5fa; --panel:#ffffff; --panel-hi:#f6f7fb;
    --line:#e2e5ee; --fg:#1b1f2c; --muted:#5f6679; --faint:#7d8497;
    --link:#b84f00; --shadow:0 1px 2px rgba(27,31,44,.06), 0 10px 30px rgba(27,31,44,.08);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:0 16px 64px; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--link); text-underline-offset:3px; }
  .wrap { max-width:1040px; margin:0 auto; }
  button { font:inherit; }

  /* top bar */
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; padding:18px 0 8px; }
  .brand > span[data-product] { white-space:nowrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
  .brand .mark { width:30px; height:30px; border-radius:8px; background:var(--accent); display:grid; place-items:center; color:#fff; }
  .brand .mark svg { width:18px; height:18px; }
  .controls { display:flex; gap:8px; }
  .pill-btn {
    background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:14px; cursor:pointer; line-height:1.2;
  }
  .pill-btn:hover { border-color:var(--accent); }
  .pill-btn[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* hero */
  .hero { padding:48px 0 28px; }
  .hero h1 { font-size:clamp(32px, 6vw, 52px); line-height:1.1; margin:0 0 14px; letter-spacing:-.5px; }
  .hero h1 .name { color:var(--accent); }
  .hero p.lede { font-size:clamp(17px, 2.2vw, 20px); color:var(--muted); max-width:700px; margin:0 0 22px; }
  .hero .cta { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; border-radius:12px; padding:12px 20px;
    border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; text-decoration:none; cursor:pointer;
  }
  .btn:hover { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--accent); color:var(--fg); }
  .btn:disabled { opacity:.5; cursor:default; }
  .ver { font-size:13px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  /* unofficial-fork warning: a strip above everything, a badge by the name,
     the full text under the hero */
  .fork-strip {
    margin:0 -16px; padding:9px 16px; background:#ffb020; color:#1b1300; font-size:14px; font-weight:600;
    text-align:center; line-height:1.4;
  }
  .fork-strip a { color:#1b1300; font-weight:700; }
  .badge-fork {
    font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; white-space:nowrap;
    color:#1b1300; background:#ffb020; border-radius:999px; padding:2px 9px;
  }
  .disclaimer {
    margin-top:26px; padding:16px 18px; border-radius:14px; max-width:780px;
    border:2px solid #ffb020; background:rgba(255,176,32,.10);
  }
  .disclaimer h2 { font-size:19px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .disclaimer h2 svg { width:22px; height:22px; color:#ffb020; flex:none; }
  .disclaimer ul { margin:0; padding-left:20px; }
  .disclaimer li { margin:6px 0; font-size:15px; }
  .notice {
    margin-top:22px; padding:12px 14px; border-radius:12px; background:var(--bg-alt);
    border:1px solid var(--line); color:var(--muted); font-size:14px; max-width:760px;
  }

  /* sections */
  section { padding:34px 0 8px; }
  h2 { font-size:clamp(24px, 3.4vw, 30px); margin:0 0 6px; letter-spacing:-.3px; }
  .sub { color:var(--muted); margin:0 0 22px; max-width:720px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px;
    box-shadow:var(--shadow);
  }
  .card .ic { width:42px; height:42px; border-radius:11px; display:grid; place-items:center; margin-bottom:12px; }
  .card .ic svg { width:24px; height:24px; }
  .card h3 { margin:0 0 6px; font-size:18px; }
  .card p { margin:0; color:var(--muted); font-size:15px; }
  .acc { margin-top:10px; font-size:14px; color:var(--fg); display:flex; gap:6px; align-items:flex-start; }
  .acc svg { width:16px; height:16px; flex:0 0 auto; margin-top:3px; color:var(--accent); }
  .acc .soon { color:var(--muted); }
  .card .how { display:inline-block; margin-top:10px; font-size:14px; font-weight:600; color:var(--accent); text-decoration:none; }
  .card .how:hover { text-decoration:underline; }
  /* how each tool works: one block per tool, three cards, as on the scale */
  .guide { display:flex; flex-direction:column; gap:22px; }
  .guide article { scroll-margin-top:16px; }
  .guide h3 { margin:0 0 10px; font-size:19px; display:flex; align-items:center; gap:10px; }
  .guide h3 i { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .guide .grid { grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); }
  .guide h4 { margin:0 0 6px; font-size:15px; }
  .guide .card p { white-space:pre-line; min-width:0; }
  /* coming soon: what is not in a published version yet */
  .soon-grp { margin:0 0 10px; font-size:16px; color:var(--muted); font-weight:600; }
  .soon-grp + .grid { margin-bottom:22px; }
  .card .state { display:inline-block; margin-top:10px; font-size:12px; font-weight:600; border-radius:999px; padding:2px 10px; }
  .card .state.next { color:var(--ok); border:1px solid var(--ok); }
  .card .state.ok { color:var(--ok); border:1px solid var(--ok); }
  .card .state.prep { color:var(--muted); border:1px solid var(--line); }
  .tag { display:inline-block; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle; font-weight:500; }

  /* install steps */
  .step { display:flex; align-items:center; gap:12px; margin:28px 0 12px; }
  .step .n {
    width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-weight:700; flex:0 0 auto;
  }
  .step h3 { margin:0; font-size:20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .panel > p:first-child { margin-top:0; }
  .hint { color:var(--muted); font-size:14px; margin:10px 0 0; }

  .boards { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px; }
  .board {
    display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid var(--line);
    border-radius:12px; cursor:pointer; background:var(--panel-hi);
  }
  .board:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .board input { margin-top:4px; accent-color:var(--accent); width:18px; height:18px; }
  .board b { display:block; }
  .board small { color:var(--muted); }

  .picker { display:flex; flex-direction:column; gap:8px; }
  .prow {
    display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line);
    border-radius:12px; background:var(--panel-hi);
  }
  .prow.off { opacity:.55; }
  .prow input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); flex:0 0 auto; }
  .prow .ic { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto; }
  .prow .ic svg { width:20px; height:20px; }
  .prow .t { flex:1; min-width:0; }
  .prow .t b { display:block; }
  .prow .t small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .arrows { display:flex; gap:6px; flex:0 0 auto; }
  .arrows button {
    width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--panel);
    color:var(--fg); cursor:pointer; font-size:14px;
  }
  .arrows button:hover:not(:disabled) { border-color:var(--accent); }
  .arrows button:disabled { opacity:.3; cursor:default; }
  .center { text-align:center; }
  esp-web-install-button button {
    border-radius:12px; padding:13px 26px; border:0; background:var(--accent); color:#fff;
    font-weight:600; font-size:17px; cursor:pointer;
  }
  .status { margin-top:12px; min-height:1.6em; font-size:15px; }
  .status.ok { color:var(--ok); }
  .status.bad { color:var(--bad); }
  .no-serial .needs-serial { display:none; }
  .serial-warn { display:none; }
  .no-serial .serial-warn { display:block; }

  /* heat press memo spotlight */
  .spot { display:grid; grid-template-columns:1.15fr 1fr; gap:22px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--shadow); }
  .spot .kicker { display:inline-block; font-size:13px; font-weight:600; color:#e24b4a; border:1px solid #e24b4a55;
    background:#e24b4a18; border-radius:999px; padding:3px 10px; margin-bottom:10px; }
  .spot ul { margin:14px 0 0; padding-left:20px; color:var(--muted); }
  .spot li { margin:6px 0; }
  .spot li b { color:var(--fg); font-weight:600; }
  /* The heat press memo's settings screen, drawn at the panel's 480x320
     proportions: every size is in cqw (1cqw = 4.8 panel px), so it scales as one. */
  .shot { min-width:0; }
  .screen { container-type:inline-size; position:relative; aspect-ratio:3/2; border-radius:14px; border:6px solid #262b35; overflow:hidden;
    background:linear-gradient(180deg,#3a1408,#0e0a10); color:#fff; font-family:Montserrat,system-ui,sans-serif; }
  .screen .hd { position:absolute; left:0; top:0; width:100%; height:10cqw; display:flex; align-items:center; font-weight:600; }
  .screen .hd .bk { width:11.7cqw; text-align:center; font-size:5.4cqw; }
  .screen .hd .tt { font-size:4.2cqw; }
  .screen .gl { position:absolute; box-sizing:border-box; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); border-radius:2.9cqw; }
  .screen .k { font-size:2.5cqw; color:rgba(255,255,255,.6); text-transform:uppercase; letter-spacing:.04em; }
  .screen .ring { position:absolute; left:2.9cqw; top:12.1cqw; width:39.2cqw; height:39.2cqw; }
  .screen .ring svg { position:absolute; inset:0; width:100%; height:100%; }
  .screen .ring .mid { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:#4fd1ee; }
  .screen .ring .mid b { display:block; font-size:10cqw; line-height:1; }
  .screen .ring .mid small { display:block; font-size:2.9cqw; color:rgba(255,255,255,.6); margin-top:.8cqw; }
  .screen .tc { left:45cqw; top:12.1cqw; width:52.5cqw; height:15.8cqw; padding:1.7cqw 2.9cqw; }
  .screen .tc .v { font-size:8.3cqw; font-weight:700; line-height:1.1; color:#ff9a4d; }
  .screen .tc .v small { font-size:4.2cqw; margin-left:.8cqw; }
  .screen .mi { top:29.6cqw; width:25.2cqw; height:11.3cqw; padding:1.2cqw 2.1cqw; }
  .screen .mi .v { font-size:3.3cqw; font-weight:700; }
  .screen .nt { position:absolute; left:45cqw; top:42.5cqw; width:52.5cqw; font-size:2.7cqw; line-height:1.3; color:#ffd66b; }
  .screen .go { position:absolute; left:2.5cqw; top:53.75cqw; width:95cqw; height:10.8cqw; border-radius:5.4cqw; display:grid; place-items:center;
    background:#c8462f; font-size:4.2cqw; font-weight:700; }
  .shot .soon-tag { display:inline-block; margin-top:10px; font-size:12px; font-weight:600; border-radius:999px; padding:2px 10px;
    color:var(--muted); border:1px solid var(--line); }
  @media (max-width:760px) { .spot { grid-template-columns:1fr; padding:18px; } }
  ol.first { margin:12px 0 0; padding-left:22px; }
  ol.first li { margin:8px 0; color:var(--muted); }
  ol.first li b { color:var(--fg); }
  .feedback { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  .card .ic.feat { background:rgba(255,122,24,.14); color:var(--accent); }
  footer .copy { margin-top:14px; }
  footer { margin-top:56px; padding-top:22px; border-top:1px solid var(--line); color:var(--faint); font-size:14px; }
  footer p { margin:0 0 8px; }

  @media (max-width:560px) {
    .prow { gap:10px; padding:10px; }
    .prow .ic { display:none; }
    .arrows button { width:34px; height:34px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="fork-strip" role="note"><span data-t="strip"></span> <a href="#avertissement" data-t="strip_l"></a></div>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      <span data-product></span>
      <span class="badge-fork" data-t="badge"></span>
    </div>
    <div class="controls">
      <button class="pill-btn" data-lang="fr" type="button">FR</button>
      <button class="pill-btn" data-lang="en" type="button">EN</button>
      <button class="pill-btn" id="theme" type="button"></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><span class="name" data-product></span><br><span data-t="hero_t"></span></h1>
      <p class="lede" data-t="hero_p"></p>
      <div class="cta">
        <a class="btn" href="#install" data-t="hero_btn"></a>
        <a class="btn ghost" href="#presse" data-t="hero_presse"></a>
        <a class="btn ghost" href="#tools" data-t="hero_tools"></a>
        <span class="ver" id="ver" hidden></span>
      </div>
      <div class="disclaimer" id="avertissement">
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span data-t="dis_t"></span></h2>
        <ul>
          <li data-t="dis_1"></li>
          <li data-t="dis_2"></li>
          <li><span data-t="dis_3"></span> <a id="dis-issue" data-t="dis_3l"></a></li>
          <li data-t="dis_4"></li>
          <li data-t="dis_5"></li>
        </ul>
      </div>
    </section>

    <section id="presse">
      <div class="spot">
        <div>
          <span class="kicker" data-t="pr_kick"></span>
          <h2 data-t="pr_t"></h2>
          <p class="sub" data-t="pr_p"></p>
          <ul>
            <li><b data-t="pr_l1b"></b> <span data-t="pr_l1"></span></li>
            <li><b data-t="pr_l2b"></b> <span data-t="pr_l2"></span></li>
            <li><b data-t="pr_l3b"></b> <span data-t="pr_l3"></span></li>
            <li><b data-t="pr_l4b"></b> <span data-t="pr_l4"></span></li>
          </ul>
        </div>
        <div class="shot">
          <div class="screen" aria-hidden="true">
            <div class="hd"><span class="bk">‹</span><span class="tt" data-t="pr_ex_item"></span></div>
            <div class="ring">
              <svg viewBox="0 0 188 188"><circle cx="94" cy="94" r="82" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.12)" stroke-width="12"/>
                <circle cx="94" cy="94" r="82" fill="none" stroke="#4fd1ee" stroke-width="12" stroke-linecap="round" stroke-dasharray="515.2" stroke-dashoffset="309" transform="rotate(-90 94 94)"/></svg>
              <div class="mid"><div><b>6</b><small data-t="pr_ex_sec"></small></div></div>
            </div>
            <div class="gl tc"><div class="k" data-t="pr_ex_temp"></div><div class="v">160<small>°C</small></div></div>
            <div class="gl mi" style="left:45cqw"><div class="k" data-t="pr_ex_press"></div><div class="v" data-t="pr_ex_pressv"></div></div>
            <div class="gl mi" style="left:72.3cqw"><div class="k" data-t="pr_ex_peel"></div><div class="v" data-t="pr_ex_peelv"></div></div>
            <div class="nt" data-t="pr_ex_note"></div>
            <div class="go" data-t="pr_ex_stop"></div>
          </div>
          <span class="soon-tag" data-t="pr_ex_soon"></span>
        </div>
      </div>
    </section>

    <section id="tools">
      <h2 data-t="tools_t"></h2>
      <p class="sub" data-t="tools_p"></p>
      <div class="grid" id="cards"></div>
    </section>

    <section id="guide">
      <h2 data-t="guide_t"></h2>
      <p class="sub" data-t="guide_p"></p>
      <div class="guide" id="guide-list"></div>
    </section>

    <section id="more">
      <h2 data-t="more_t"></h2>
      <p class="sub" data-t="more_p"></p>
      <div class="grid">
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div><h3 data-t="f_sleep_t"></h3><p data-t="f_sleep_p"></p></div>
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 0 1 2-5M19 12a7 7 0 0 0-2-5M8.5 12a3.5 3.5 0 0 1 1-2.5M15.5 12a3.5 3.5 0 0 0-1-2.5"/><circle cx="12" cy="12" r="1.2"/><path d="M12 13.5V20"/></svg></div><h3 data-t="f_rfid_t"></h3><p data-t="f_rfid_p"></p></div>
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></div><h3 data-t="f_ota_t"></h3><p data-t="f_ota_p"></p></div>
      </div>
    </section>

    <section id="studio">
      <h2 data-t="st_t"></h2>
      <p class="sub" data-t="st_p"></p>
      <div class="grid" id="studio-has"></div>
      <div class="cta" style="margin-top:16px"><a class="btn ghost" id="studio-dl" data-t="st_btn"></a></div>
    </section>

    <section id="soon">
      <h2 data-t="soon_t"></h2>
      <p class="sub" data-t="soon_p"></p>
      <h3 class="soon-grp" data-t="soon_scale"></h3>
      <div class="grid" id="soon-scale"></div>
      <h3 class="soon-grp" data-t="soon_studio"></h3>
      <div class="grid" id="soon-studio"></div>

      const next = [known.get('tigerscale')];

      link.href = t.needs.url;

      const soon = document.createElement('span');
      soon.className = 'soon'; soon.textContent = '(' + tr('acc_soon') + ')';
      span.append(soon);

    a.append(span);
    return a;

      ic.className = 'ic'; ic.innerHTML = icon(t); tint(ic, t.color);
      const h = document.createElement('h3');
      h.textContent = t.name[lang];
      if (t.core) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = tr('core'); h.append(tag); }

      p.textContent = t.desc[lang];
      c.append(ic, h, p);

      box.append(c);

      const dot = document.createElement('i'); dot.style.background = t.color;
      h.append(dot, document.createTextNode(t.name[lang]));
      const g = document.createElement('div'); g.className = 'grid';
      ['help_what', 'help_can', 'help_how'].forEach((k, i) => {
        const c = document.createElement('div'); c.className = 'card';
        const t4 = document.createElement('h4'); t4.textContent = tr(k);
        const p = document.createElement('p'); p.textContent = help[lang][i];
        c.append(t4, p); g.append(c);
      });
      art.append(h, g); box.append(art);
    });
  }

  // What is not published yet. `next`: checked and waiting for the next
  // version; otherwise still in preparation. Move an entry out of here (into
  // tools.js or the "Also on the scale" cards) the day its version is out.
  const SOON = {
    scale: [
      { next: true,
        fr: ['TigerPOD : alerte « 1 puce sur 2 »', 'Quand une seule des deux puces d\'une bobine Bambu Lab est lue, une barre jaune te prévient, avec un bouton qui lance le réglage RFID automatique.'],
        en: ['TigerPOD: "1 chip of 2" alert', 'When only one of the two chips of a Bambu Lab spool is read, a yellow bar tells you, with a button that starts the automatic RFID setting.'] },
      { fr: ['Outil Minuterie', 'Jusqu\'à 3 minuteries en même temps, chacune avec son nom (« vernis », « séchage »…), en compte à rebours ou en chrono, avec tes durées favorites.'],
        en: ['Timer tool', 'Up to 3 timers at once, each with its own name ("varnish", "drying"...), counting down or up, with your favourite durations.'] },
      { fr: ['Dosage résine : pré-réglages et temps de travail', 'Choisis ta résine dans une liste (époxy 1:1, 2:1, silicone…) ou crée la tienne, puis un minuteur te dit combien de temps il reste avant que le mélange prenne.'],
        en: ['Resin mixing: presets and working time', 'Pick your resin from a list (epoxy 1:1, 2:1, silicone...) or make your own, then a timer tells you how long is left before the mix sets.'] },
      { fr: ['Nouveau mémo presse à chaud', 'Un écran tout neuf, des fonds au choix ou ta propre photo, et 38 produits déjà réglés.'],
        en: ['New heat press memo', 'A brand new screen, backgrounds to choose from or your own photo, and 38 products already set.'] },
      { fr: ['Pèse-colis connecté au PC', 'Le poids du colis s\'affiche sur ton PC, prêt à copier dans ton site d\'envoi.'],
        en: ['Parcel scale connected to the PC', 'The parcel\'s weight shows on your PC, ready to copy into your shipping site.'] },
      { fr: ['Aide « ? » dans chaque outil', 'Trois petites cartes expliquent chaque outil sur l\'écran : à quoi il sert, ce qu\'on peut faire et comment faire.'],
        en: ['"?" help in every tool', 'Three short cards explain each tool on the screen: what it is for, what you can do and how.'] },
      { fr: ['Réveil de l\'écran à distance', 'L\'écran de la balance se rallume depuis Tiger Studio Fork (bouton Réveiller), sans la toucher. Le bouton est déjà dans Studio, mais il faut ce prochain firmware pour qu\'il marche.'],
        en: ['Wake the screen remotely', 'The scale\'s screen turns back on from Tiger Studio Fork (Wake up button), without touching it. The button is already in Studio, but it needs this next firmware to work.'] }
    ],
    studio: [
      { fr: ['Version macOS', 'Le Tiger Studio du fork s\'installera aussi sur Mac (Apple Silicon et Intel).'],
        en: ['macOS version', 'This fork\'s Tiger Studio will also install on a Mac (Apple Silicon and Intel).'] }
    ]
  };

  // What the fork's Tiger Studio already ships (published releases only).
  const STUDIO_HAS = [
    { fr: ['La balance en lecteur TigerPOD', 'Avec l\'outil TigerPOD ouvert, les deux lecteurs de la balance apparaissent dans Studio comme des lecteurs RFID : ouvrir, écrire, restaurer ou effacer une puce.'],
      en: ['The scale as a TigerPOD reader', 'With the TigerPOD tool open, the scale\'s two readers show up in Studio as RFID readers: open, write, restore or erase a chip.'] },
    { fr: ['Puces Bambu Lab', 'Une puce Bambu Lab est lue (matière, couleur, poids, températures). La bobine n\'est ajoutée qu\'une fois ses deux puces lues, et Studio dit laquelle manque.'],
      en: ['Bambu Lab chips', 'A Bambu Lab chip is read (material, colour, weight, temperatures). The spool is added only once both its chips are read, and Studio says which one is missing.'] },
    { fr: ['Scanner de codes-barres', 'Un code scanné ouvre le produit du catalogue, partout dans l\'appli. Un bouton choisit où il agit : partout, seulement dans la recherche, ou pas du tout.'],
      en: ['Barcode scanner', 'A scanned code opens the catalogue product, anywhere in the app. A button chooses where it acts: anywhere, only in the search bar, or not at all.'] },
    { fr: ['Impression directe des étiquettes', 'Sur une Marklife P15 (Bluetooth), une Brother QL (réseau) ou une imprimante installée, sans passer par la fenêtre d\'impression.'],
      en: ['Direct label printing', 'On a Marklife P15 (Bluetooth), a Brother QL (network) or an installed printer, without the print dialog.'] },
    { fr: ['Étiquettes sur A4 et en lot', 'Plusieurs étiquettes par feuille A4, le nombre de copies, ou une étiquette par bobine cochée, en une seule fois.'],
      en: ['Labels on A4 and in batches', 'Several labels per A4 sheet, the number of copies, or one label per ticked spool, in one go.'] },
    { fr: ['Valeurs choisies sur l\'étiquette', 'Un grand dessin de l\'étiquette : clique sur une ligne pour choisir ce qu\'elle affiche.'],
      en: ['Values chosen on the label', 'A large drawing of the label: click a line to choose what it shows.'] },
    { fr: ['Caméras et plans', 'Afficher ou couper toutes les caméras d\'un coup. La molette fait défiler les plans, Ctrl + molette zoome.'],
      en: ['Cameras and plans', 'Show or stop all cameras at once. The wheel scrolls the plans, Ctrl + wheel zooms.'] },
    { fr: ['Tout sélectionner', 'Dans les vues en tuiles, un bouton coche toutes les bobines affichées par le filtre.'],
      en: ['Select all', 'In the tile views, a button ticks every spool the filter shows.'] }
  ];

  function drawStudio() {
    const box = document.getElementById('studio-has');
    box.textContent = '';
    STUDIO_HAS.forEach(f => {
      const c = document.createElement('div'); c.className = 'card';
      const h = document.createElement('h3'); h.textContent = f[lang][0];
      const p = document.createElement('p'); p.textContent = f[lang][1];
      const st = document.createElement('span'); st.className = 'state ok'; st.textContent = tr('st_ok');
      c.append(h, p, st); box.append(c);
    });
  }

  function drawSoon() {
    ['scale', 'studio'].forEach(k => {
      const box = document.getElementById('soon-' + k);
      box.textContent = '';
      SOON[k].forEach(f => {
        const c = document.createElement('div'); c.className = 'card';
        const h = document.createElement('h3'); h.textContent = f[lang][0];
        const p = document.createElement('p'); p.textContent = f[lang][1];
        const st = document.createElement('span');
        st.className = 'state ' + (f.next ? 'next' : 'prep');
        st.textContent = tr(f.next ? 'soon_next' : 'soon_prep');
        c.append(h, p, st); box.append(c);
      });
    });
  }

  function drawPicker() {
    const box = document.getElementById('picker');
    box.textContent = '';
    picks.forEach((p, k) => {
      const t = tool(p.id);
      const row = document.createElement('div');
      row.className = 'prow' + (p.on ? '' : ' off');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = p.on; cb.disabled = k === 0;
      cb.setAttribute('aria-label', t.name[lang]);
      cb.onchange = () => { p.on = cb.checked; savePicks(); drawPicker(); };
      const ic = document.createElement('div');
      ic.className = 'ic'; ic.innerHTML = icon(t); tint(ic, t.color);
      const tx = document.createElement('div');
      tx.className = 't';
      const b = document.createElement('b'); b.textContent = t.name[lang];
      const s = document.createElement('small');
      s.textContent = t.needs ? t.needs[lang] : t.desc[lang];
      tx.append(b, s);
      row.append(cb, ic, tx);
      if (k > 0) {
        const ar = document.createElement('div');
        ar.className = 'arrows';
        const up = document.createElement('button');
        up.type = 'button'; up.textContent = '▲'; up.disabled = k < 2;
        up.setAttribute('aria-label', t.name[lang] + ' ▲');
        up.onclick = () => { [picks[k - 1], picks[k]] = [picks[k], picks[k - 1]]; savePicks(); drawPicker(); };
        const dn = document.createElement('button');
        dn.type = 'button'; dn.textContent = '▼'; dn.disabled = k === picks.length - 1;
        dn.setAttribute('aria-label', t.name[lang] + ' ▼');
        dn.onclick = () => { [picks[k + 1], picks[k]] = [picks[k], picks[k + 1]]; savePicks(); drawPicker(); };
        ar.append(up, dn);
        row.append(ar);
      }
      box.append(row);
    });
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-product]').forEach(e => { e.textContent = P; });
    document.getElementById('fb-tool').href = ISSUES + '?title=' + encodeURIComponent(tr('fb_tool_title'));
    document.getElementById('fb-issue').href = ISSUES;
    document.getElementById('dis-issue').href = ISSUES;
    document.getElementById('studio-dl').href = 'https://github.com/juditech3D/TigerTag-Studio-Manager/releases/latest';
    document.getElementById('calib-guide').href = OFFICIAL_SITE;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tr(e.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    paintTheme();
    drawCards();
    drawGuide();
    drawStudio();
    drawSoon();
    drawPicker();
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('mt-lang', lang); } catch (e) {}
    applyLang();
  }));

  const official = document.getElementById('official-site');
  official.href = OFFICIAL_SITE;
  official.textContent = OFFICIAL_SITE.replace('https://', '').replace(/\/$/, '');
  document.getElementById('source').href = SOURCE;

  // Theme
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const isDark = () => {
    const forced = root.getAttribute('data-theme');
    if (forced) return forced === 'dark';
    return !window.matchMedia('(prefers-color-scheme: light)').matches;
  };
  function paintTheme() { themeBtn.textContent = isDark() ? tr('theme_light') : tr('theme_dark'); }
  themeBtn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('mt-theme', next); } catch (e) {}
    paintTheme();
  });

  // Board -> installer manifest
  const installer = document.getElementById('installer');
  document.querySelectorAll('input[name=board]').forEach(r => r.addEventListener('change', () => {
    installer.manifest = 'manifest-' + r.value + '.json';
  }));

  // The version, from the same manifest the scale's own update check reads.
  fetch('version.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(v => { if (v && v.version) { const e = document.getElementById('ver'); e.textContent = 'v' + v.version; e.hidden = false; } })
    .catch(() => {});

  // Step 4: the selection over USB. The firmware answers "TOOLS OK on=..." on
  // its serial port (toolsSerialTask). The line is sent again every second for
  // a while, because opening the port can restart the board, and the first
  // lines would then reach a scale that is still booting.
  if (!('serial' in navigator)) document.body.classList.add('no-serial');
  const status = document.getElementById('status');
  const say = (msg, cls) => { status.textContent = msg; status.className = 'status' + (cls ? ' ' + cls : ''); };
  const applyBtn = document.getElementById('apply');

  applyBtn.addEventListener('click', async () => {
    // The shown tools in their order; the scale puts the hidden ones after them.
    const shown = picks.filter(p => p.on && p.id !== 'tigerscale').map(p => p.id);
    const msg = 'TOOLS=' + (shown.length ? shown.join(',') : 'none') + '\n';
    applyBtn.disabled = true;
    let port = null, reader = null, writer = null, reading = null;
    try {
      say(tr('st_open'));
      // The port the installer was given is already allowed: no second prompt.
      port = (await navigator.serial.getPorts()).find(p => p.getInfo().usbVendorId === 0x303a) || null;
      if (!port) {
        try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] }); }
        catch (e) { say(tr('st_none'), 'bad'); return; }
      }
      try { await port.open({ baudRate: 115200 }); }
      catch (e) { say(tr('st_busy'), 'bad'); port = null; return; }
      writer = port.writable.getWriter();
      reader = port.readable.getReader();
      const dec = new TextDecoder();
      let buf = '', answer = null;
      reading = (async () => {
        try {
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const m = buf.match(/TOOLS OK on=(\S*)/);
            if (m) { answer = m[1]; break; }
            if (buf.length > 20000) buf = buf.slice(-2000);
          }
        } catch (e) { /* cancelled, or the board restarted */ }
      })();
      say(tr('st_wait'));
      const enc = new TextEncoder();
      const until = Date.now() + 25000;
      while (!answer && Date.now() < until) {
        try { await writer.write(enc.encode(msg)); } catch (e) { /* board restarting */ }
        await new Promise(r => setTimeout(r, 1000));
      }
      if (answer) {
        const names = answer.split(',').map(id => (tool(id) ? tool(id).name[lang] : id));
        say(tr('st_ok') + names.join(', ') + '.', 'ok');
      } else {
        say(tr('st_timeout'), 'bad');
      }
    } catch (e) {
      say(tr('st_err') + (e && e.message ? e.message : e), 'bad');
    } finally {
      try { if (reader) await reader.cancel(); } catch (e) {}
      try { if (reading) await reading; } catch (e) {}
      try { if (reader) reader.releaseLock(); } catch (e) {}
      try { if (writer) writer.releaseLock(); } catch (e) {}
      try { if (port) await port.close(); } catch (e) {}
      applyBtn.disabled = false;
    }
  });

  applyLang();
  // The tool blocks are drawn by the script, after the browser has already
  // looked for the #help-<id> target: scroll to it now that it exists.
  if (location.hash.startsWith('#help-')) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
})();
</script>
