<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger Multi-tools — firmware multi-outils pour balance TigerScale V3</title>
<meta name="description" content="Un firmware non officiel pour la balance TigerScale V3 : la pesée des bobines plus des outils au choix (TigerPOD, pèse-colis, calibration, mémo presse), installé depuis le navigateur.">
<meta name="theme-color" content="#0d0f14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<script src="tools.js"></script>
<script>
  // The product's name in one place: the header and the texts all read it, so
  // renaming the fork is this line (and the <title> above).
  window.PRODUCT = 'Tiger Multi-tools';
  (function () {
    try {
      var t = localStorage.getItem('mt-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --accent:#ff7a18; --accent-strong:#e96900; --ok:#1aaf6c; --bad:#e6352b;
    --bg:#0d0f14; --bg-alt:#13161d; --panel:#161a22; --panel-hi:#1d222c;
    --line:#2a303c; --fg:#f2f4f8; --muted:#a0a7b5; --faint:#7f8796;
    --link:#ff9a4d; --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#ffffff; --bg-alt:#f3f5fa; --panel:#ffffff; --panel-hi:#f6f7fb;
      --line:#e2e5ee; --fg:#1b1f2c; --muted:#5f6679; --faint:#7d8497;
      --link:#b84f00; --shadow:0 1px 2px rgba(27,31,44,.06), 0 10px 30px rgba(27,31,44,.08);
      color-scheme:light;
    }
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --bg-alt:#f3f5fa; --panel:#ffffff; --panel-hi:#f6f7fb;
    --line:#e2e5ee; --fg:#1b1f2c; --muted:#5f6679; --faint:#7d8497;
    --link:#b84f00; --shadow:0 1px 2px rgba(27,31,44,.06), 0 10px 30px rgba(27,31,44,.08);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:0 16px 64px; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--link); text-underline-offset:3px; }
  .wrap { max-width:1040px; margin:0 auto; }
  button { font:inherit; }

  /* top bar */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 0 8px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
  .brand .mark { width:30px; height:30px; border-radius:8px; background:var(--accent); display:grid; place-items:center; color:#fff; }
  .brand .mark svg { width:18px; height:18px; }
  .controls { display:flex; gap:8px; }
  .pill-btn {
    background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:14px; cursor:pointer; line-height:1.2;
  }
  .pill-btn:hover { border-color:var(--accent); }
  .pill-btn[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* hero */
  .hero { padding:48px 0 28px; }
  .hero h1 { font-size:clamp(32px, 6vw, 52px); line-height:1.1; margin:0 0 14px; letter-spacing:-.5px; }
  .hero h1 .name { color:var(--accent); }
  .hero p.lede { font-size:clamp(17px, 2.2vw, 20px); color:var(--muted); max-width:700px; margin:0 0 22px; }
  .hero .cta { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; border-radius:12px; padding:12px 20px;
    border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; text-decoration:none; cursor:pointer;
  }
  .btn:hover { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  .btn.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  .btn.ghost:hover { border-color:var(--accent); color:var(--fg); }
  .btn:disabled { opacity:.5; cursor:default; }
  .ver { font-size:13px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  .notice {
    margin-top:22px; padding:12px 14px; border-radius:12px; background:var(--bg-alt);
    border:1px solid var(--line); color:var(--muted); font-size:14px; max-width:760px;
  }

  /* sections */
  section { padding:34px 0 8px; }
  h2 { font-size:clamp(24px, 3.4vw, 30px); margin:0 0 6px; letter-spacing:-.3px; }
  .sub { color:var(--muted); margin:0 0 22px; max-width:720px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px;
    box-shadow:var(--shadow);
  }
  .card .ic { width:42px; height:42px; border-radius:11px; display:grid; place-items:center; margin-bottom:12px; }
  .card .ic svg { width:24px; height:24px; }
  .card h3 { margin:0 0 6px; font-size:18px; }
  .card p { margin:0; color:var(--muted); font-size:15px; }
  .acc { margin-top:10px; font-size:14px; color:var(--fg); display:flex; gap:6px; align-items:flex-start; }
  .acc svg { width:16px; height:16px; flex:0 0 auto; margin-top:3px; color:var(--accent); }
  .acc .soon { color:var(--muted); }
  .tag { display:inline-block; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle; font-weight:500; }

  /* install steps */
  .step { display:flex; align-items:center; gap:12px; margin:28px 0 12px; }
  .step .n {
    width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-weight:700; flex:0 0 auto;
  }
  .step h3 { margin:0; font-size:20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .panel > p:first-child { margin-top:0; }
  .hint { color:var(--muted); font-size:14px; margin:10px 0 0; }

  .boards { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px; }
  .board {
    display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid var(--line);
    border-radius:12px; cursor:pointer; background:var(--panel-hi);
  }
  .board:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .board input { margin-top:4px; accent-color:var(--accent); width:18px; height:18px; }
  .board b { display:block; }
  .board small { color:var(--muted); }

  .picker { display:flex; flex-direction:column; gap:8px; }
  .prow {
    display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line);
    border-radius:12px; background:var(--panel-hi);
  }
  .prow.off { opacity:.55; }
  .prow input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); flex:0 0 auto; }
  .prow .ic { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto; }
  .prow .ic svg { width:20px; height:20px; }
  .prow .t { flex:1; min-width:0; }
  .prow .t b { display:block; }
  .prow .t small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .arrows { display:flex; gap:6px; flex:0 0 auto; }
  .arrows button {
    width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--panel);
    color:var(--fg); cursor:pointer; font-size:14px;
  }
  .arrows button:hover:not(:disabled) { border-color:var(--accent); }
  .arrows button:disabled { opacity:.3; cursor:default; }
  .center { text-align:center; }
  esp-web-install-button button {
    border-radius:12px; padding:13px 26px; border:0; background:var(--accent); color:#fff;
    font-weight:600; font-size:17px; cursor:pointer;
  }
  .status { margin-top:12px; min-height:1.6em; font-size:15px; }
  .status.ok { color:var(--ok); }
  .status.bad { color:var(--bad); }
  .no-serial .needs-serial { display:none; }
  .serial-warn { display:none; }
  .no-serial .serial-warn { display:block; }

  /* heat press memo spotlight */
  .spot { display:grid; grid-template-columns:1.15fr 1fr; gap:22px; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:var(--shadow); }
  .spot .kicker { display:inline-block; font-size:13px; font-weight:600; color:#e24b4a; border:1px solid #e24b4a55;
    background:#e24b4a18; border-radius:999px; padding:3px 10px; margin-bottom:10px; }
  .spot ul { margin:14px 0 0; padding-left:20px; color:var(--muted); }
  .spot li { margin:6px 0; }
  .spot li b { color:var(--fg); font-weight:600; }
  .screen { background:#0b0d12; color:#f2f4f8; border-radius:14px; border:6px solid #262b35; padding:14px; font-size:14px; }
  .screen .crumb { color:#a0a7b5; font-size:12px; margin-bottom:8px; }
  .screen .crumb b { color:#2980b9; }
  .screen .vals { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .screen .v { background:#161a22; border-radius:10px; padding:8px 10px; }
  .screen .v small { display:block; color:#a0a7b5; font-size:11px; }
  .screen .v b { font-size:22px; }
  .screen .timer { margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .screen .bar { flex:1; height:8px; border-radius:4px; background:#262b35; overflow:hidden; }
  .screen .bar i { display:block; width:62%; height:100%; background:#3fc8e4; }
  .screen .go { background:#e24b4a; border-radius:8px; padding:6px 12px; font-weight:600; font-size:13px; }
  @media (max-width:760px) { .spot { grid-template-columns:1fr; padding:18px; } }
  ol.first { margin:12px 0 0; padding-left:22px; }
  ol.first li { margin:8px 0; color:var(--muted); }
  ol.first li b { color:var(--fg); }
  .feedback { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  .card .ic.feat { background:rgba(255,122,24,.14); color:var(--accent); }
  footer .copy { margin-top:14px; }
  footer { margin-top:56px; padding-top:22px; border-top:1px solid var(--line); color:var(--faint); font-size:14px; }
  footer p { margin:0 0 8px; }

  @media (max-width:560px) {
    .prow { gap:10px; padding:10px; }
    .prow .ic { display:none; }
    .arrows button { width:34px; height:34px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/></svg>
      </span>
      <span data-product></span>
    </div>
    <div class="controls">
      <button class="pill-btn" data-lang="fr" type="button">FR</button>
      <button class="pill-btn" data-lang="en" type="button">EN</button>
      <button class="pill-btn" id="theme" type="button"></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><span class="name" data-product></span><br><span data-t="hero_t"></span></h1>
      <p class="lede" data-t="hero_p"></p>
      <div class="cta">
        <a class="btn" href="#install" data-t="hero_btn"></a>
        <a class="btn ghost" href="#presse" data-t="hero_presse"></a>
        <a class="btn ghost" href="#tools" data-t="hero_tools"></a>
        <span class="ver" id="ver" hidden></span>
      </div>
      <p class="notice" data-t="notice"></p>
    </section>

    <section id="presse">
      <div class="spot">
        <div>
          <span class="kicker" data-t="pr_kick"></span>
          <h2 data-t="pr_t"></h2>
          <p class="sub" data-t="pr_p"></p>
          <ul>
            <li><b data-t="pr_l1b"></b> <span data-t="pr_l1"></span></li>
            <li><b data-t="pr_l2b"></b> <span data-t="pr_l2"></span></li>
            <li><b data-t="pr_l3b"></b> <span data-t="pr_l3"></span></li>
            <li><b data-t="pr_l4b"></b> <span data-t="pr_l4"></span></li>
          </ul>
        </div>
        <div class="screen" aria-hidden="true">
          <div class="crumb"><b>DTF</b> › <span data-t="pr_ex_item"></span></div>
          <div class="vals">
            <div class="v"><small data-t="pr_ex_temp"></small><b>160 °C</b></div>
            <div class="v"><small data-t="pr_ex_time"></small><b>15 s</b></div>
            <div class="v"><small data-t="pr_ex_press"></small><b data-t="pr_ex_pressv"></b></div>
            <div class="v"><small data-t="pr_ex_peel"></small><b data-t="pr_ex_peelv"></b></div>
          </div>
          <div class="timer"><div class="bar"><i></i></div><span>0:06</span><span class="go" data-t="pr_ex_stop"></span></div>
        </div>
      </div>
    </section>

    <section id="tools">
      <h2 data-t="tools_t"></h2>
      <p class="sub" data-t="tools_p"></p>
      <div class="grid" id="cards"></div>
    </section>

    <section id="more">
      <h2 data-t="more_t"></h2>
      <p class="sub" data-t="more_p"></p>
      <div class="grid">
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div><h3 data-t="f_sleep_t"></h3><p data-t="f_sleep_p"></p></div>
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 0 1 2-5M19 12a7 7 0 0 0-2-5M8.5 12a3.5 3.5 0 0 1 1-2.5M15.5 12a3.5 3.5 0 0 0-1-2.5"/><circle cx="12" cy="12" r="1.2"/><path d="M12 13.5V20"/></svg></div><h3 data-t="f_rfid_t"></h3><p data-t="f_rfid_p"></p></div>
        <div class="card"><div class="ic feat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></div><h3 data-t="f_ota_t"></h3><p data-t="f_ota_p"></p></div>
      </div>
    </section>

    <section id="install">
      <h2 data-t="inst_t"></h2>
      <p class="sub" data-t="inst_p"></p>
      <p class="notice serial-warn" data-t="no_serial"></p>

      <div class="step"><span class="n">1</span><h3 data-t="s1"></h3></div>
      <div class="panel">
        <div class="boards">
          <label class="board">
            <input type="radio" name="board" value="esp32s3_hsu_b" checked>
            <span><b>ESP32-S3-Touch-LCD-3.5B</b><small data-t="b35b"></small></span>
          </label>
          <label class="board">
            <input type="radio" name="board" value="esp32s3_hsu">
            <span><b>ESP32-S3-Touch-LCD-3.5</b><small data-t="b35"></small></span>
          </label>
        </div>
        <p class="hint" data-t="b_tested"></p>
      </div>

      <div class="step"><span class="n">2</span><h3 data-t="s2"></h3></div>
      <div class="panel">
        <p data-t="s2_p"></p>
        <div class="picker" id="picker"></div>
        <p class="hint" data-t="s2_hint"></p>
      </div>

      <div class="step"><span class="n">3</span><h3 data-t="s3"></h3></div>
      <div class="panel center">
        <esp-web-install-button id="installer" manifest="manifest-esp32s3_hsu_b.json">
          <button slot="activate" data-t="s3_btn"></button>
          <span slot="unsupported" data-t="no_serial_short"></span>
          <span slot="not-allowed">HTTPS</span>
        </esp-web-install-button>
        <p class="hint" data-t="s3_hint"></p>
      </div>

      <div class="step"><span class="n">4</span><h3 data-t="s4"></h3></div>
      <div class="panel center">
        <p data-t="s4_p"></p>
        <button class="btn needs-serial" id="apply" type="button" data-t="s4_btn"></button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <p class="hint" data-t="s4_hint"></p>
      </div>

      <div class="step"><span class="n">5</span><h3 data-t="s5"></h3></div>
      <div class="panel">
        <p data-t="s5_p"></p>
        <ol class="first">
          <li><b data-t="s5_1b"></b> <span data-t="s5_1"></span> <a id="calib-guide" data-t="s5_1l"></a></li>
          <li><b data-t="s5_2b"></b> <span data-t="s5_2"></span></li>
        </ol>
        <p class="hint" data-t="s5_hint"></p>
      </div>
    </section>

    <section id="feedback">
      <h2 data-t="fb_t"></h2>
      <p class="sub" data-t="fb_p"></p>
      <div class="feedback">
        <a class="btn" id="fb-tool" data-t="fb_tool"></a>
        <a class="btn ghost" id="fb-issue" data-t="fb_issue"></a>
      </div>
    </section>
  </main>

  <footer>
    <p><span data-t="foot_1"></span> <a id="official-site"></a></p>
    <p><span data-t="foot_2"></span> <a id="source">GitHub</a> · <span data-t="foot_3"></span></p>
    <p class="copy">© 2026 Juditech3D · <span data-product></span>. <span data-t="foot_copy"></span></p>
  </footer>
</div>

<script>
(function () {
  const P = window.PRODUCT;
  const OFFICIAL_SITE = 'https://tigertag-project.github.io/Tiger-Scale-V3/';
  const SOURCE = 'https://github.com/juditech3D/Tiger-Scale-V3';
  const ISSUES = 'https://github.com/juditech3D/Tiger-Scale-V3/issues/new';

  const T = {
    fr: {
      hero_t: 'Ta balance, avec les outils que tu veux.',
      hero_p: 'Un seul appareil dans l\'atelier, plusieurs outils sous la main. La balance TigerScale V3 garde la pesée des bobines et devient aussi mémo de presse à chaud, pèse-colis, lecteur TigerPOD… Tu tires le maximum du même matériel, et tu choisis les outils affichés, et leur ordre, avant même d\'installer.',
      hero_btn: 'Installer',
      hero_tools: 'Voir les outils',
      hero_presse: 'Le mémo presse',
      notice: P + ' est un fork non officiel du firmware TigerScale V3. Il n\'est ni édité ni soutenu par le TigerTag Project. Il reste compatible avec les puces TigerTag et Tiger Studio.',
      tools_t: 'Les outils',

      core: 'toujours là',
      acc_get: 'Télécharger le fichier',
      acc_soon: 'Fichier bientôt disponible',
      inst_t: 'Installer depuis le navigateur',

      s1: 'Ta carte',
      b35b: 'La plus courante : « 3.5B » est écrit au dos.',
      b35: 'Celle sans « B » au dos.',
      s2: 'Tes outils et leur ordre',
      s2_p: 'Coche les outils à afficher dans le menu de démarrage et range-les avec les flèches. Tiger Scale reste toujours en premier.',
      s2_hint: 'Si tu ne gardes que Tiger Scale, la balance démarre directement sur la pesée, sans menu.',
      s3: 'Installer le firmware',
      s3_btn: 'Installer',

      s4: 'Envoyer ton choix d\'outils',

      st_err: 'Erreur : ',
      theme_dark: 'Sombre', theme_light: 'Clair',
      foot_1: 'Pour fabriquer la balance (pièces, câblage, boîtier), suis le guide du projet officiel :',
      foot_2: 'Code source de ce fork :',
      foot_3: 'TigerTag et TigerScale sont des marques du TigerTag Project.',
      foot_copy: 'D\'après le firmware TigerScale V3, © 2026 TigerTag Project, sous licence MIT.',

  };

  let lang = 'fr';
  try {
    lang = localStorage.getItem('mt-lang') ||
           ((navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  } catch (e) {}
  if (!T[lang]) lang = 'en';
  const tr = k => T[lang][k] || T.en[k] || k;

  // The selection: every tool in menu order, each shown or not. Tiger Scale
  // is first and always shown. Remembered in this browser between visits.
  let picks = window.TOOLS.map(t => ({ id: t.id, on: true }));
  try {
    const saved = JSON.parse(localStorage.getItem('mt-picks') || 'null');
    if (Array.isArray(saved)) {
      const known = new Map(picks.map(p => [p.id, p]));
      const next = [known.get('tigerscale')];
      known.delete('tigerscale');
      saved.forEach(s => { if (known.has(s.id)) { next.push({ id: s.id, on: !!s.on }); known.delete(s.id); } });
      known.forEach(p => next.push(p));   // tools added since the last visit
      picks = next;
    }
  } catch (e) {}
  const savePicks = () => { try { localStorage.setItem('mt-picks', JSON.stringify(picks)); } catch (e) {} };
  const tool = id => window.TOOLS.find(t => t.id === id);

  function icon(t) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
           (window.TOOL_ICONS[t.icon] || '') + '</svg>';
  }
  function tint(el, color) { el.style.background = color + '22'; el.style.color = color; }

  // What a tool needs besides the firmware, with its link or "coming soon".
  function needs(t) {
    const a = document.createElement('p');
    a.className = 'acc';
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.4v5"/><path d="M12 16.4h.01"/><circle cx="12" cy="12" r="9.2"/></svg>';
    const span = document.createElement('span');
    span.textContent = t.needs[lang] + ' ';
    if (t.needs.url) {
      const link = document.createElement('a');
      link.href = t.needs.url;
      link.textContent = (t.needs.label && t.needs.label[lang]) || tr('acc_get');
      span.append(link);
    } else {
      const soon = document.createElement('span');
      soon.className = 'soon'; soon.textContent = '(' + tr('acc_soon') + ')';
      span.append(soon);
    }
    a.append(span);
    return a;
  }

  function drawCards() {
    const box = document.getElementById('cards');
    box.textContent = '';
    window.TOOLS.forEach(t => {
      const c = document.createElement('article');
      c.className = 'card';
      const ic = document.createElement('div');
      ic.className = 'ic'; ic.innerHTML = icon(t); tint(ic, t.color);
      const h = document.createElement('h3');
      h.textContent = t.name[lang];
      if (t.core) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = tr('core'); h.append(tag); }
      const p = document.createElement('p');
      p.textContent = t.desc[lang];
      c.append(ic, h, p);
      if (t.needs) c.append(needs(t));
      box.append(c);
    });
  }

  function drawPicker() {
    const box = document.getElementById('picker');
    box.textContent = '';
    picks.forEach((p, k) => {
      const t = tool(p.id);
      const row = document.createElement('div');
      row.className = 'prow' + (p.on ? '' : ' off');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = p.on; cb.disabled = k === 0;
      cb.setAttribute('aria-label', t.name[lang]);
      cb.onchange = () => { p.on = cb.checked; savePicks(); drawPicker(); };
      const ic = document.createElement('div');
      ic.className = 'ic'; ic.innerHTML = icon(t); tint(ic, t.color);
      const tx = document.createElement('div');
      tx.className = 't';
      const b = document.createElement('b'); b.textContent = t.name[lang];
      const s = document.createElement('small');
      s.textContent = t.needs ? t.needs[lang] : t.desc[lang];
      tx.append(b, s);
      row.append(cb, ic, tx);
      if (k > 0) {
        const ar = document.createElement('div');
        ar.className = 'arrows';
        const up = document.createElement('button');
        up.type = 'button'; up.textContent = '▲'; up.disabled = k < 2;
        up.setAttribute('aria-label', t.name[lang] + ' ▲');
        up.onclick = () => { [picks[k - 1], picks[k]] = [picks[k], picks[k - 1]]; savePicks(); drawPicker(); };
        const dn = document.createElement('button');
        dn.type = 'button'; dn.textContent = '▼'; dn.disabled = k === picks.length - 1;
        dn.setAttribute('aria-label', t.name[lang] + ' ▼');
        dn.onclick = () => { [picks[k + 1], picks[k]] = [picks[k], picks[k + 1]]; savePicks(); drawPicker(); };
        ar.append(up, dn);
        row.append(ar);
      }
      box.append(row);
    });
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-product]').forEach(e => { e.textContent = P; });
    document.getElementById('fb-tool').href = ISSUES + '?title=' + encodeURIComponent(tr('fb_tool_title'));
    document.getElementById('fb-issue').href = ISSUES;
    document.getElementById('calib-guide').href = OFFICIAL_SITE;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tr(e.dataset.t); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    paintTheme();
    drawCards();
    drawPicker();
  }
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('mt-lang', lang); } catch (e) {}
    applyLang();
  }));

  const official = document.getElementById('official-site');
  official.href = OFFICIAL_SITE;
  official.textContent = OFFICIAL_SITE.replace('https://', '').replace(/\/$/, '');
  document.getElementById('source').href = SOURCE;

  // Theme
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const isDark = () => {
    const forced = root.getAttribute('data-theme');
    if (forced) return forced === 'dark';
    return !window.matchMedia('(prefers-color-scheme: light)').matches;
  };
  function paintTheme() { themeBtn.textContent = isDark() ? tr('theme_light') : tr('theme_dark'); }
  themeBtn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('mt-theme', next); } catch (e) {}
    paintTheme();
  });

  // Board -> installer manifest
  const installer = document.getElementById('installer');
  document.querySelectorAll('input[name=board]').forEach(r => r.addEventListener('change', () => {
    installer.manifest = 'manifest-' + r.value + '.json';
  }));

  // The version, from the same manifest the scale's own update check reads.
  fetch('version.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(v => { if (v && v.version) { const e = document.getElementById('ver'); e.textContent = 'v' + v.version; e.hidden = false; } })
    .catch(() => {});

  // Step 4: the selection over USB. The firmware answers "TOOLS OK on=..." on
  // its serial port (toolsSerialTask). The line is sent again every second for
  // a while, because opening the port can restart the board, and the first
  // lines would then reach a scale that is still booting.
  if (!('serial' in navigator)) document.body.classList.add('no-serial');
  const status = document.getElementById('status');
  const say = (msg, cls) => { status.textContent = msg; status.className = 'status' + (cls ? ' ' + cls : ''); };
  const applyBtn = document.getElementById('apply');

  applyBtn.addEventListener('click', async () => {
    // The shown tools in their order; the scale puts the hidden ones after them.
    const shown = picks.filter(p => p.on && p.id !== 'tigerscale').map(p => p.id);
    const msg = 'TOOLS=' + (shown.length ? shown.join(',') : 'none') + '\n';
    applyBtn.disabled = true;
    let port = null, reader = null, writer = null, reading = null;
    try {
      say(tr('st_open'));
      // The port the installer was given is already allowed: no second prompt.
      port = (await navigator.serial.getPorts()).find(p => p.getInfo().usbVendorId === 0x303a) || null;
      if (!port) {
        try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] }); }
        catch (e) { say(tr('st_none'), 'bad'); return; }
      }
      try { await port.open({ baudRate: 115200 }); }
      catch (e) { say(tr('st_busy'), 'bad'); port = null; return; }
      writer = port.writable.getWriter();
      reader = port.readable.getReader();
      const dec = new TextDecoder();
      let buf = '', answer = null;
      reading = (async () => {
        try {
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const m = buf.match(/TOOLS OK on=(\S*)/);
            if (m) { answer = m[1]; break; }
            if (buf.length > 20000) buf = buf.slice(-2000);
          }
        } catch (e) { /* cancelled, or the board restarted */ }
      })();
      say(tr('st_wait'));
      const enc = new TextEncoder();
      const until = Date.now() + 25000;
      while (!answer && Date.now() < until) {
        try { await writer.write(enc.encode(msg)); } catch (e) { /* board restarting */ }
        await new Promise(r => setTimeout(r, 1000));
      }
      if (answer) {
        const names = answer.split(',').map(id => (tool(id) ? tool(id).name[lang] : id));
        say(tr('st_ok') + names.join(', ') + '.', 'ok');
      } else {
        say(tr('st_timeout'), 'bad');
      }
    } catch (e) {
      say(tr('st_err') + (e && e.message ? e.message : e), 'bad');
    } finally {
      try { if (reader) await reader.cancel(); } catch (e) {}
      try { if (reading) await reading; } catch (e) {}
      try { if (reader) reader.releaseLock(); } catch (e) {}
      try { if (writer) writer.releaseLock(); } catch (e) {}
      try { if (port) await port.close(); } catch (e) {}
      applyBtn.disabled = false;
    }
  });

  applyLang();
})();
</script>
